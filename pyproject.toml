[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "app-pagamentos"
version = "0.1.0"
description = "Gestão de alunos e mensalidades para professor de educação física"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
